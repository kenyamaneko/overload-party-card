name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: Git tag to promote to prod (e.g. v1.2.3).
        required: true
        type: string

permissions:
  contents: read
  # Workload Identity Federation で Google Cloud に認証するために OIDC トークンの発行権限が必要
  id-token: write

jobs:
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-dev-${{ github.repository }}
      # デプロイ中断による中途半端な反映を避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-deploy.yaml@main
    secrets: inherit
    with:
      image-name: card
      target: dev
      project-id: ${{ vars.DEV_PROJECT_ID }}
      region: ${{ vars.RUN_REGION }}

  publish-master-data-dev:
    needs: deploy-dev
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    concurrency:
      group: publish-master-data-dev-${{ github.repository }}
      # 反映の中断で古いマスターデータが残るのを避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish master data
        uses: ./.github/actions/publish-master-data
        with:
          bucket: ${{ vars.DEV_MASTER_DATA_BUCKET }}
          wif-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-stg:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: deploy-stg-${{ github.repository }}
      # デプロイ中断による中途半端な反映を避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-deploy.yaml@main
    secrets: inherit
    with:
      image-name: card
      target: stg
      project-id: ${{ vars.STG_PROJECT_ID }}
      region: ${{ vars.RUN_REGION }}
      version: ${{ github.ref_name }}

  publish-master-data-stg:
    needs: deploy-stg
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    concurrency:
      group: publish-master-data-stg-${{ github.repository }}
      # 反映の中断で古いマスターデータが残るのを避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish master data
        uses: ./.github/actions/publish-master-data
        with:
          bucket: ${{ vars.STG_MASTER_DATA_BUCKET }}
          wif-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-prod-${{ github.repository }}
      # デプロイ中断による中途半端な反映を避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-deploy.yaml@main
    secrets: inherit
    with:
      image-name: card
      target: prod
      project-id: ${{ vars.PROD_PROJECT_ID }}
      region: ${{ vars.RUN_REGION }}
      version: ${{ inputs.version }}

  publish-master-data-prod:
    needs: deploy-prod
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    concurrency:
      group: publish-master-data-prod-${{ github.repository }}
      # 反映の中断で古いマスターデータが残るのを避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    steps:
      # 昇格したイメージと同じコミットのマスターデータを反映するため、指定されたタグを取得する
      - name: Checkout target version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Publish master data
        uses: ./.github/actions/publish-master-data
        with:
          bucket: ${{ vars.PROD_MASTER_DATA_BUCKET }}
          wif-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.CI_SERVICE_ACCOUNT }}
