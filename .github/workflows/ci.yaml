name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  PROJECT_ID: keyandnotes-platform
  REPOSITORY: overload-party
  IMAGE_NAME: card

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      # golangci-lint-action のビルド済みバイナリは Go 1.25 未対応のため
      # go install でソースからビルドして使う
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run lint
        run: golangci-lint run --timeout 5m ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run unit tests
        run: go test -race -count=1 ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test-integration:
    # ubuntu-latest には Docker がプリインストールされており、Testcontainers が
    # postgres:16-alpine を起動してリポジトリ層テストを実行する。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Testcontainers はテスト中に自動 pull するが、時間がかかりタイムアウトの原因になるため事前に取得する
      - name: Pre-pull postgres image (Testcontainers)
        run: docker pull postgres:16-alpine
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  codegen-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure private repo auth
        # pip install で git+https://github.com/kenyamaneko/... を clone するために
        # token-based 認証 (insteadOf) を git config に注入する。
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Install Python dependencies
        run: |
          pip install pyyaml \
            "overload-party-doc-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/doc-tools"
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Run codegen (OpenAPI)
        run: scripts/generate_types.sh
      - name: Run schema-doc codegen
        run: python3 scripts/generate_schema_doc.py
      - name: Check for drift
        run: .github/scripts/ci/check-codegen-drift.sh

  spec-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest
      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}"
      - name: Detect breaking changes in data/openapi.yaml
        run: .github/scripts/ci/openapi-diff.sh "origin/${{ github.base_ref }}"

  build-and-push:
    needs: [lint, test-unit, test-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Generate Cross-Repo Deps App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
          GO_MODULES_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build \
            --secret id=GO_MODULES_TOKEN,env=GO_MODULES_TOKEN \
            -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
