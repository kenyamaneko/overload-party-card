name: Publish

# api-card (Go module) と api-card-npm (Cloudsmith npm) を手動でタグ付け・公開する。
# バージョンを上げるタイミングは人が判断して workflow_dispatch で実行する。
# タグの手動打ちは禁止 — このワークフローがモジュールタグの唯一の発行元。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package to publish"
        required: true
        default: "api-card"
        type: choice
        options:
          - api-card
          - api-card-npm
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish-api-card:
    if: inputs.target == 'api-card'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/api-card/go.mod

      - name: Vet api-card
        run: go vet ./...
        working-directory: packages/api-card

      - name: Build api-card
        run: go build ./...
        working-directory: packages/api-card

      - name: Determine next tag
        id: tag
        env:
          PREFIX: packages/api-card/v
          BUMP: ${{ inputs.bump }}
        run: .github/scripts/publish/next-tag.sh

      - name: Tag and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/publish/tag-and-push.sh

  publish-api-card-npm:
    if: inputs.target == 'api-card-npm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine next tag
        id: tag
        env:
          PREFIX: packages/api-card-npm/v
          BUMP: ${{ inputs.bump }}
        run: .github/scripts/publish/next-tag.sh

      - name: Build & version npm package
        working-directory: packages/api-card-npm
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ../../.github/scripts/publish/build-npm.sh

      - name: Publish to Cloudsmith
        uses: kenyamaneko/overload-party-common/.github/actions/publish-to-cloudsmith@main
        with:
          format: npm
          package-path: packages/api-card-npm

      - name: Tag and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/publish/tag-and-push.sh
