# Card pack master (SSoT for `card.card_pack` table).
#
# 各 pack は配布対象カード集合と各カードの配布枚数の組。配布の合成
# (basic + 選択 faction 等) は subscriber 側で複数 pack を順次配布する形で
# 表現する。
#
# 直接編集してよいのは本ファイルのみ。db/seed/card_packs_seed.sql は
# scripts/generate_card_packs.py で生成される。

packs:
  - pack_id: basic
    description: 全プレイヤー共通の Neutral 基本セット
    selection:
      type: by_factions
      factions: [Neutral]
    copies_per_card: 3

  - pack_id: faction_set_she
    description: SHE 基本セット
    selection:
      type: by_factions
      factions: [SHE]
    copies_per_card: 3

  - pack_id: faction_set_tenki
    description: Tenki 基本セット
    selection:
      type: by_factions
      factions: [Tenki]
    copies_per_card: 3

  - pack_id: faction_set_sugar
    description: Sugar 基本セット
    selection:
      type: by_factions
      factions: [Sugar]
    copies_per_card: 3

  - pack_id: faction_set_tuners
    description: Tuners 基本セット
    selection:
      type: by_factions
      factions: [Tuners]
    copies_per_card: 3
