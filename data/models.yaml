# Card service model definitions (service-owned SSoT per ADR-014/ADR-015).
#
# scripts/generate_types.py reads this file and generates wire types into
#   packages/api-card/   (Go module, package apicard)
#
# Ownership: overload-party-card publishes these types. Consumers (gateway,
# battle, client) import them as stable contracts.

files:
  # ─── Card ──────────────────────────────────────────────
  - name: card
    target: both
    pkg: apicard
    imports:
      - encoding/json
      - time
    types:
      - name: CardDefinition
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: CardName, type: string, json: "card_name"}
          - {name: ResourceLabel, type: string, json: "resource_label"}
          - {name: Faction, type: string, json: "faction"}
          - {name: CardType, type: string, json: "card_type"}
          - {name: Subtype, type: "*string", json: "subtype,omitempty"}
          - {name: DeployTurns, type: int64, json: "deploy_turns"}
          - {name: Resizable, type: bool, json: "resizable"}
          - {name: Elastic, type: bool, json: "elastic"}
          - {name: ElasticIncrement, type: int64, json: "elastic_increment,omitempty"}
          - {name: FreeTier, type: int64, json: "free_tier,omitempty"}
          - {name: CostPerRequest, type: int64, json: "cost_per_request,omitempty"}
          - {name: Stats, type: json.RawMessage, json: "stats"}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty"}
          - {name: Effects, type: json.RawMessage, json: "effects,omitempty"}
          - {name: PassiveEffects, type: "[]PassiveEffect", json: "passive_effects,omitempty"}
          - {name: PlatformEffects, type: "[]PlatformEffect", json: "platform_effects,omitempty"}
          - {name: AttachmentEffects, type: "[]AttachmentEffect", json: "attachment_effects,omitempty"}
          - {name: Restriction, type: string, json: "restriction"}
          - {name: IsActive, type: bool, json: "is_active"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}

  # ─── Card Stats ────────────────────────────────────────
  - name: card_stats
    target: both
    pkg: apicard
    types:
      - name: ComputeStats
        comment: "ComputeStats for Compute, Container, Orchestrator, Serverless, AI/ML card types."
        fields:
          - {name: Throughput, type: int64, json: "throughput"}
          - {name: ThroughputMax, type: "*int64", json: "throughput_max,omitempty"}
          - {name: Availability, type: int64, json: "availability"}
          - {name: MaintenanceCost, type: int64, json: "maintenance_cost"}
          - {name: SLAPenalty, type: int64, json: "sla_penalty"}

      - name: DataStats
        comment: "DataStats for Database, ObjectStorage, CacheDB card types."
        fields:
          - {name: Yield, type: int64, json: "yield"}
          - {name: YieldMax, type: "*int64", json: "yield_max,omitempty"}
          - {name: Availability, type: int64, json: "availability"}
          - {name: MaintenanceCost, type: int64, json: "maintenance_cost"}
          - {name: SLAPenalty, type: int64, json: "sla_penalty"}

  # ─── Passive / Platform / Attachment Effects ───────────
  - name: passive_effect
    target: both
    pkg: apicard
    type_aliases:
      - {name: PassiveEffectType, base: string}
      - {name: PlatformEffectType, base: string}
      - {name: AttachmentEffectType, base: string}
    constants:
      - type: PassiveEffectType
        values:
          - {name: PassiveTPPerBackendDB, value: "tp_per_backend_db"}
          - {name: PassiveTPPerBackendData, value: "tp_per_backend_data"}
          - {name: PassiveTPIfCardTypeOnField, value: "tp_if_card_type_on_field"}
          - {name: PassiveYieldPerOtherDB, value: "dv_per_other_db"}
          - {name: PassiveYieldIfCardOnField, value: "dv_if_card_on_field"}
          - {name: PassiveAVBonus, value: "av_bonus"}
          - {name: PassiveScaleCostFree, value: "scale_cost_free"}
      - type: PlatformEffectType
        values:
          - {name: PlatformTPBonus, value: "tp_bonus"}
          - {name: PlatformYieldBonus, value: "yield_bonus"}
          - {name: PlatformAVBonus, value: "av_bonus"}
      - type: AttachmentEffectType
        values:
          - {name: AttachmentStatBonus, value: "stat_bonus"}
    types:
      - name: PassiveEffect
        fields:
          - {name: Type, type: PassiveEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: PlatformEffect
        fields:
          - {name: Type, type: PlatformEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: AttachmentEffect
        fields:
          - {name: Type, type: AttachmentEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

  # ─── Deck ──────────────────────────────────────────────
  - name: deck
    target: both
    pkg: apicard
    imports:
      - encoding/json
      - time
    types:
      - name: PlayerCardWithDef
        comment: "PlayerCardWithDef is a PlayerCard enriched with card definition fields for API responses."
        fields:
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "art_no", doc: "アート番号"}
          - {name: Count, type: int, json: "count", doc: "所持枚数"}
          - {name: CardName, type: string, json: "card_name", doc: "カード名"}
          - {name: ResourceLabel, type: string, json: "resource_label", doc: "リソースラベル（AWS/Azure/Google Cloud/Oracle のサービス名）"}
          - {name: Faction, type: string, json: "faction", doc: "ファクション（`SHE` / `Tenki` / `Sugar` / `Tuners` / `Neutral`）"}
          - {name: CardType, type: string, json: "card_type", doc: "カード種別"}
          - {name: Subtype, type: "*string", json: "subtype,omitempty", doc: "サブタイプ（Compute/Data 配下のみ: VM/Container/Database 等）"}
          - {name: DeployTurns, type: int64, json: "deploy_turns", doc: "デプロイターン数（0=即時）"}
          - {name: Resizable, type: bool, json: "resizable", doc: "手動スケール可能か"}
          - {name: Elastic, type: bool, json: "elastic", doc: "自動スケール対応か"}
          - {name: Stats, type: json.RawMessage, json: "stats", doc: "スタッツ（ComputeStats または DataStats）"}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty", doc: "エフェクト説明テキスト"}
          - {name: Restriction, type: string, json: "restriction", doc: "制限（`unlimited` / `semi_limited` / `limited` / `forbidden`）"}

      - name: Deck
        comment: "Deck is the API response for a player's deck with optional card list."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: DeckID, type: int64, json: "deck_id", doc: "デッキID（自動採番）"}
          - {name: DeckName, type: string, json: "deck_name", doc: "デッキ名"}
          - {name: IsValid, type: bool, json: "is_valid", doc: "バトル使用可能か（都度算出: 30枚 + 全カード所持 + 制限枚数以内）"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty", doc: "プレイマット番号（null: デフォルト）"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty", doc: "スリーブ番号（null: デフォルト）"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}
          - {name: DeckCards, type: "[]DeckCard", json: "deck_cards,omitempty", comment: "Populated by the service layer for API responses.", doc: "デッキのカード構成（`card_id`, `art_no`, `count`）"}

      - name: DeckCard
        comment: "DeckCard is a single card entry within a deck."
        fields:
          - {name: PlayerID, type: string, json: "player_id", doc: "プレイヤーID"}
          - {name: DeckID, type: int64, json: "deck_id", doc: "デッキID"}
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "art_no", doc: "アート番号"}
          - {name: Count, type: int, json: "count", doc: "枚数"}

      - name: DeckCardEntry
        comment: "DeckCardEntry represents a card entry in a deck create/update request."
        fields:
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "art_no", doc: "アート番号"}
          - {name: Count, type: int, json: "count", doc: "枚数"}

      - name: DeckCreateRequest
        comment: "DeckCreateRequest is the request body for POST /decks."
        fields:
          - {name: DeckName, type: string, json: "deck_name", doc: "デッキ名"}
          - {name: Cards, type: "[]DeckCardEntry", json: "cards", doc: "デッキのカード構成"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty", doc: "プレイマット番号"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty", doc: "スリーブ番号"}

      - name: DeckUpdateRequest
        comment: "DeckUpdateRequest is the request body for PUT /decks/:id."
        fields:
          - {name: DeckName, type: string, json: "deck_name", doc: "デッキ名"}
          - {name: Cards, type: "[]DeckCardEntry", json: "cards", doc: "デッキのカード構成"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty", doc: "プレイマット番号"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty", doc: "スリーブ番号"}

      - name: DeckDetailResponse
        comment: "DeckDetailResponse is the API response for GET /player/decks/{deckId}."
        fields:
          - {name: Deck, type: Deck, json: "deck", doc: "デッキ本体"}
          - {name: Cards, type: "[]DeckCard", json: "cards", doc: "デッキ内のカード一覧"}

  # ─── Grant Pack ────────────────────────────────────────
  - name: grant_pack
    target: both
    pkg: apicard
    types:
      - name: GrantPackRequest
        comment: "GrantPackRequest is the request body for grant-initial-pack / grant-faction-pack."
        fields:
          - {name: Faction, type: string, json: "faction", doc: "付与するファクション（SHE / Tenki / Sugar / Tuners）"}

      - name: GrantPackResponse
        comment: "GrantPackResponse is the response for grant-initial-pack / grant-faction-pack."
        fields:
          - {name: CardsGranted, type: int, json: "cardsGranted", doc: "付与されたカード枚数（カード種別数 x 3）"}

  # ─── Card with Ownership ──────────────────────────────
  - name: card_ownership
    target: both
    pkg: apicard
    imports:
      - encoding/json
      - time
    types:
      - name: CardWithOwnership
        comment: "CardWithOwnership is a CardDefinition enriched with per-player ownership flag."
        fields:
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: CardName, type: string, json: "card_name", doc: "カード名"}
          - {name: ResourceLabel, type: string, json: "resource_label", doc: "リソースラベル"}
          - {name: Faction, type: string, json: "faction", doc: "ファクション"}
          - {name: CardType, type: string, json: "card_type", doc: "カード種別"}
          - {name: Subtype, type: "*string", json: "subtype,omitempty", doc: "サブタイプ（Compute/Data 配下のみ: VM/Container/Database 等）"}
          - {name: DeployTurns, type: int64, json: "deploy_turns", doc: "デプロイターン数"}
          - {name: Resizable, type: bool, json: "resizable", doc: "手動スケール可能か"}
          - {name: Elastic, type: bool, json: "elastic", doc: "自動スケール対応か"}
          - {name: ElasticIncrement, type: int64, json: "elastic_increment,omitempty", doc: "自動スケール増分"}
          - {name: FreeTier, type: int64, json: "free_tier,omitempty", doc: "無料枠"}
          - {name: CostPerRequest, type: int64, json: "cost_per_request,omitempty", doc: "リクエスト単価"}
          - {name: Stats, type: json.RawMessage, json: "stats", doc: "スタッツ JSON"}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty", doc: "エフェクト説明テキスト"}
          - {name: Effects, type: json.RawMessage, json: "effects,omitempty", doc: "エフェクト定義 JSON"}
          - {name: PassiveEffects, type: "[]PassiveEffect", json: "passive_effects,omitempty", doc: "パッシブエフェクト"}
          - {name: PlatformEffects, type: "[]PlatformEffect", json: "platform_effects,omitempty", doc: "プラットフォームエフェクト"}
          - {name: AttachmentEffects, type: "[]AttachmentEffect", json: "attachment_effects,omitempty", doc: "アタッチメントエフェクト"}
          - {name: Restriction, type: string, json: "restriction", doc: "制限区分"}
          - {name: IsActive, type: bool, json: "is_active", doc: "有効フラグ"}
          - {name: CreatedAt, type: time.Time, json: "created_at", doc: "作成日時"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at", doc: "更新日時"}
          - {name: IsOwned, type: bool, json: "is_owned", doc: "プレイヤーが所持しているか"}
