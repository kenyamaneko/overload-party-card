# Product master data (SSoT).
#
# プロダクトはデッキのメタ情報。陣営はプロダクトを複数持てる (1:N)。デッキは陣営の
# プロダクトを 1 つ選び、その中からルーチン (1ターン1回) / スペシャル (1ゲーム1回) を
# 各 1 つセットする。施策 (Initiative) は data/initiatives.yaml で別管理する。
#
# Consumed by scripts/generate_products.py (initiatives.yaml と併せて読み込まれる) to generate:
#   - data/cache/products_gen.json (Go embed; /internal/v1/products と /api/v1/cards/products で配信)
#   - db/seed/products_seed.sql (PostgreSQL UPSERT seed)
#   - docs/PRODUCTS.md (human-readable product list)

products:
  - product_id: PD-0001
    faction: SHE
    product_name: ECサイト

  - product_id: PD-0002
    faction: Tenki
    product_name: 天気予報アプリ

  - product_id: PD-0003
    faction: Sugar
    product_name: レシピアプリ

  - product_id: PD-0004
    faction: Tuners
    product_name: 音楽配信サイト
